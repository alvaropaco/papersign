name: Playwright Tests
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e_tests:
    name: 'E2E Tests'

    # hosted runners have 16g RAM; V8 default heap in a 10g
    # container is 5g and tsc dies (134). Match hosted's effective 8g.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: [self-hosted, linux, x64, ci]
    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - uses: ./.github/actions/node-install

      - name: Start Services
        run: npm run dx:up

      - name: Point env at DinD service hosts
        # On hosted runners, docker = localhost. Here `docker` talks to the
        # job's private DinD sidecar, whose published ports answer on the
        # sidecar address, not 127.0.0.1 (see docs/OPERATIONS.md).
        run: |
          h=${DOCKER_HOST#tcp://}; h=${h%%:*}
          sed -i -E "s@(127\.0\.0\.1|localhost):(54320|63790|9000|2500|1100)@${h}:\2@g" .env
          grep -E "DATABASE_URL|REDIS_URL" .env

      - uses: ./.github/actions/playwright-install

      - name: Create the database
        run: npm run prisma:migrate-dev

      - name: Seed the database
        run: npm run prisma:seed

      - name: Install playwright browsers
        run: npx playwright install

      - name: Run Playwright tests
        run: npm run ci
        env:
          # Needed since we use next start which will set the NODE_ENV to production
          NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: './example/cert.p12'
          DANGEROUS_BYPASS_RATE_LIMITS: 'true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: 'packages/app-tests/**/test-results/*'
          retention-days: 7
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
