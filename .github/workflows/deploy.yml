name: Deploy Papersign

on:
  push:
    branches: ['main']
  schedule:
    # Safety net for repositories/forks whose push events are not reaching Actions.
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      app_image: ${{ steps.app-metadata.outputs.image }}
      app_tag: ${{ steps.app-metadata.outputs.tag }}
      docs_image: ${{ steps.docs-metadata.outputs.image }}
      docs_tag: ${{ steps.docs-metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check scheduled deployment target
        id: gate
        env:
          GIT_SHA: ${{ github.sha }}
          K8S_INFRA_PAT: ${{ secrets.K8S_INFRA_PAT }}
        run: |
          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$K8S_INFRA_PAT" ]; then
            echo 'Scheduled deployment requires K8S_INFRA_PAT to update GitOps; skipping.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          values="$(curl --fail --silent --show-error \
            https://raw.githubusercontent.com/alvaropaco/k8s-infra/master/apps/papersign/values.yaml)"

          current_app_tag="$(printf '%s' "$values" | awk '/^  tag:/ { gsub(/[[:space:]"]/, "", $2); print $2; exit }')"
          current_docs_tag="$(printf '%s' "$values" | awk '/^    tag:/ { gsub(/[[:space:]"]/, "", $2); print $2; exit }')"

          echo "gitops_app_tag=${current_app_tag:-unknown}"
          echo "gitops_docs_tag=${current_docs_tag:-unknown}"

          if [ "$current_app_tag" = "$GIT_SHA" ] && [ "$current_docs_tag" = "$GIT_SHA" ]; then
            echo 'GitOps image tags are already current; skipping scheduled build.'
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          else
            echo 'GitOps image tags differ; deploying scheduled build.'
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.gate.outputs.deploy != 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.gate.outputs.deploy != 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Set application image metadata
        if: steps.gate.outputs.deploy != 'false'
        id: app-metadata
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${GIT_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/papersign"

          {
            echo "image=${IMAGE}"
            echo "tag=${GIT_SHA}"
            echo "tags<<EOF"
            echo "${IMAGE}:${GIT_SHA}"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish application image
        if: steps.gate.outputs.deploy != 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.app-metadata.outputs.tags }}
          cache-from: type=gha,scope=papersign-app
          cache-to: type=gha,scope=papersign-app,mode=max
          build-args: |
            NEXT_PRIVATE_TELEMETRY_KEY=${{ secrets.NEXT_PRIVATE_TELEMETRY_KEY }}
            NEXT_PRIVATE_TELEMETRY_HOST=${{ secrets.NEXT_PRIVATE_TELEMETRY_HOST }}

      - name: Set docs image metadata
        if: steps.gate.outputs.deploy != 'false'
        id: docs-metadata
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${GIT_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/papersign-docs"

          {
            echo "image=${IMAGE}"
            echo "tag=${GIT_SHA}"
            echo "tags<<EOF"
            echo "${IMAGE}:${GIT_SHA}"
            echo "${IMAGE}:sha-${SHORT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish docs image
        if: steps.gate.outputs.deploy != 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.docs
          push: true
          tags: ${{ steps.docs-metadata.outputs.tags }}
          cache-from: type=gha,scope=papersign-docs
          cache-to: type=gha,scope=papersign-docs,mode=max

  bump-gitops:
    name: Update k8s-infra image tags
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    env:
      K8S_INFRA_PAT: ${{ secrets.K8S_INFRA_PAT }}
      APP_IMAGE_TAG: ${{ needs.publish.outputs.app_tag }}
      DOCS_IMAGE_TAG: ${{ needs.publish.outputs.docs_tag }}
    steps:
      - name: Check deployment prerequisites
        run: |
          if [ -z "$K8S_INFRA_PAT" ]; then
            echo "WARN: K8S_INFRA_PAT is not configured; skipping the GitOps image bump."
            exit 0
          fi

          if [ -z "$APP_IMAGE_TAG" ] || [ -z "$DOCS_IMAGE_TAG" ]; then
            echo 'Image publish was skipped because the GitOps tags are already current.'
            exit 0
          fi

      - name: Update image tags
        if: env.K8S_INFRA_PAT != ''
        run: |
          git clone --branch master --single-branch --depth 1 \
            "https://x-access-token:${K8S_INFRA_PAT}@github.com/alvaropaco/k8s-infra.git" \
            k8s-infra

          cd k8s-infra

          if [ ! -f apps/papersign/values.yaml ]; then
            echo "WARN: apps/papersign/values.yaml does not exist yet; skipping first-run bump."
            exit 0
          fi

          # The application tag is two-space indented; the docs tag is four-space indented.
          sed -i "s|^\\(  tag:\\).*$|\\1 \"${APP_IMAGE_TAG}\"|" apps/papersign/values.yaml
          sed -i "s|^\\(    tag:\\).*$|\\1 \"${DOCS_IMAGE_TAG}\"|" apps/papersign/values.yaml

          if git diff --quiet -- apps/papersign/values.yaml; then
            echo "GitOps image tags are already ${APP_IMAGE_TAG}."
            exit 0
          fi

          git config user.name 'civ-bot'
          git config user.email 'ci@0xcloud.net'
          git add apps/papersign/values.yaml
          git commit -m "papersign: bump image tags to $(printf '%s' "${APP_IMAGE_TAG}" | cut -c1-7) [skip ci]"
          git push origin HEAD:master
